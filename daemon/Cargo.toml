[package]
name = "glm-asrd"
version = "0.1.2"
edition = "2021"
description = "GLM ASR daemon for voice typing on Linux"

[features]
default = []
vello-renderer = ["dep:wgpu", "dep:vello", "dep:glyphon", "dep:pollster", "dep:futures-intrusive"]

[dependencies]
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "rustls-no-provider", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
tiny-skia = "0.12"
cosmic-text = "0.14"
wgpu = { version = "24", optional = true }
vello = { version = "0.4", optional = true }
glyphon = { version = "0.7", optional = true }
pollster = { version = "0.4", optional = true }
futures-intrusive = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
