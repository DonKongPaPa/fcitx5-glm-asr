[package]
name = "glm-asrd"
version = "0.1.0"
edition = "2021"
description = "GLM ASR daemon for voice typing on Linux"

[dependencies]
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.13", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
tiny-skia = "0.12"
cosmic-text = "0.14"

[profile.release]
opt-level = 3
lto = true
strip = true
